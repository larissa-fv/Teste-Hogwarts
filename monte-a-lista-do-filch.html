<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monte a Lista do Filch</title>
<style>
:root{--bg:#eef1f8;--panel:#fff;--ink:#1a2038;--mut:#5a6385;--line:#cfd6ea;--gold:#9a6a00;--ok:#1f7a4d;--okbg:#e2f4ea;--bad:#b3283d;--badbg:#fbe6ea;--sky:#dfe6f7;--code:#101530;--codeink:#e8ecff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10152b;--panel:#1a2142;--ink:#eef0f9;--mut:#a3accb;--line:#313b6b;--gold:#f0b94d;--ok:#6ad39b;--okbg:#14382a;--bad:#ff8497;--badbg:#44202b;--sky:#232c58;--code:#0a0e20}}
:root[data-theme="dark"]{--bg:#10152b;--panel:#1a2142;--ink:#eef0f9;--mut:#a3accb;--line:#313b6b;--gold:#f0b94d;--ok:#6ad39b;--okbg:#14382a;--bad:#ff8497;--badbg:#44202b;--sky:#232c58;--code:#0a0e20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:860px;margin:0 auto;padding:16px 16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:700 1.5rem/1.2 "Palatino Linotype",Palatino,Georgia,serif;margin:0;color:var(--gold)}
.stats{color:var(--mut);font-size:.95rem}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
h2{font:700 1.3rem/1.3 "Palatino Linotype",Palatino,Georgia,serif;margin:10px 0 2px}
.mut{color:var(--mut);margin:0 0 10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.box h3{margin:0 0 8px;font-size:.95rem;color:var(--mut);font-weight:600}
.scene{position:relative;height:84px;background:var(--sky);border-radius:10px;border:1px solid var(--line);overflow:hidden;margin:10px 0}
.scene .g{position:absolute;left:46%;top:0;bottom:0;width:8%;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.6rem;border-left:3px dashed var(--gold);border-right:3px dashed var(--gold)}
.scene .g small{font-size:.65rem;color:var(--mut)}
.scene .w,.scene .c{position:absolute;top:6px;font-size:.75rem;color:var(--mut)}
.scene .w{left:8px}.scene .c{right:8px}
.chip{position:absolute;top:30px;left:2%;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:2px 10px;font-size:.85rem;font-weight:600;white-space:nowrap;transition:left .7s ease-in-out}
.chip.p{border-color:var(--ok)}.chip.d{border-color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.rule{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--panel)}
.rule .t{flex:1}
.rule b.n{color:var(--mut);min-width:1.3em}
.tag{font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:8px}
.tag.p{background:var(--okbg);color:var(--ok)}.tag.d{background:var(--badbg);color:var(--bad)}
button{font:inherit;font-weight:700;padding:8px 12px;border-radius:9px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;min-height:44px}
button.s{padding:4px 9px;min-height:36px;font-size:.9rem}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.main{background:var(--gold);border-color:var(--gold);color:#14110a}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.res{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.res:last-child{border:0}
.res .i{font-weight:700;min-width:1.4em}.ok .i{color:var(--ok)}.no .i{color:var(--bad)}
.hint{background:var(--badbg);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin:10px 0}
.win{background:var(--okbg);border:1px solid var(--ok);border-radius:10px;padding:10px 14px;margin:10px 0}
pre{background:var(--code);color:var(--codeink);padding:12px 14px;border-radius:8px;overflow-x:auto;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:8px 0 0}
.big{font:700 2.2rem/1 "Palatino Linotype",Georgia,serif;color:var(--gold);margin:6px 0}
@media (prefers-reduced-motion:reduce){.chip{transition:none}}
</style>
</head>
<body>
<header><h1>Monte a Lista do Filch</h1><div class="stats" id="stats" aria-live="polite"></div></header>
<main id="m"></main>
<script>
const L=[
{t:'Fase 1: a ordem das regras',goal:'Só alunos da Grifinória podem passar, menos o Harry, que está de castigo.',
rules:[{id:'a',x:'Permitir: alunos da Grifinória',a:'P',f:p=>p.casa==='Grifinória',c:'access-list 10 permit 192.168.20.0 0.0.0.255'},
{id:'b',x:'Barrar: Harry Potter',a:'D',f:p=>p.nome==='Harry',c:'access-list 10 deny host 192.168.20.99'},
{id:'c',x:'Permitir: todo mundo',a:'P',f:p=>true,c:'access-list 10 permit any'},
{id:'d',x:'Barrar: alunos da Sonserina',a:'D',f:p=>p.casa==='Sonserina',c:'access-list 10 deny 192.168.30.0 0.0.0.255'}],
pk:[{n:'Hermione',p:{nome:'Hermione',casa:'Grifinória'},e:'P',w:'Hermione é da Grifinória e não está de castigo.'},{n:'Harry',p:{nome:'Harry',casa:'Grifinória'},e:'D',w:'Harry está de castigo e deve ser barrado.'},{n:'Draco',p:{nome:'Draco',casa:'Sonserina'},e:'D',w:'Draco não é da Grifinória.'},{n:'Ron',p:{nome:'Ron',casa:'Grifinória'},e:'P',w:'Ron é da Grifinória e passa.'}],
hint:'O roteador para na primeira regra que combina. Quem vem primeiro: a exceção ou a regra geral?',
tail:'interface g0/1\n ip access-group 10 in',lesson:'Exceção antes da regra geral. E repare: você não precisou barrar a Sonserina. O bloqueio invisível do final já cuida de quem não foi permitido.'},
{t:'Fase 2: a biblioteca',goal:'Alunos só podem LER na Biblioteca. Em qualquer outro lugar do castelo, ficam livres.',
rules:[{id:'a',x:'Permitir: aluno → Biblioteca, para ler',a:'P',f:p=>p.dest==='Biblioteca'&&p.ativ==='ler',c:' permit tcp 192.168.20.0 0.0.0.255 host 192.168.30.10 eq 80'},
{id:'b',x:'Barrar: aluno → Biblioteca, qualquer atividade',a:'D',f:p=>p.dest==='Biblioteca',c:' deny ip 192.168.20.0 0.0.0.255 host 192.168.30.10'},
{id:'c',x:'Permitir: todo o resto',a:'P',f:p=>true,c:' permit ip any any'},
{id:'d',x:'Barrar: todo o tráfego',a:'D',f:p=>true,c:' deny ip any any'}],
pk:[{n:'ler na Biblioteca',p:{dest:'Biblioteca',ativ:'ler'},e:'P',w:'Ler na Biblioteca é permitido.'},{n:'duelar na Biblioteca',p:{dest:'Biblioteca',ativ:'duelar'},e:'D',w:'Só ler é permitido na Biblioteca.'},{n:'comer no Salão',p:{dest:'Salão Principal',ativ:'comer'},e:'P',w:'Fora da Biblioteca, tudo livre.'},{n:'estudar na Biblioteca',p:{dest:'Biblioteca',ativ:'estudar'},e:'D',w:'Estudar não é ler: só ler é permitido nesse servidor.'}],
hint:'Três regras formam o desenho: a exceção permitida, o bloqueio do resto daquele destino e, por último, a liberação geral.',
head:'ip access-list extended BIBLIOTECA',tail:'interface g0/1\n ip access-group BIBLIOTECA in',lesson:'É assim que a ACL estendida funciona: origem, destino e serviço. A liberação geral sempre vai por último, senão ela engole as regras de baixo.'},
{t:'Fase 3: a Poção Polissuco',goal:'Barrar quem diz ser aluno mas chega pelo portão de fora. Alunos de dentro e visitantes comuns continuam passando.',
rules:[{id:'a',x:'Barrar: diz ser aluno, mas veio de fora',a:'D',f:p=>p.diz==='aluno'&&p.por==='fora',c:' deny ip 192.168.0.0 0.0.255.255 any'},
{id:'b',x:'Permitir: todo o resto',a:'P',f:p=>true,c:' permit ip any any'},
{id:'c',x:'Barrar: qualquer um que venha de fora',a:'D',f:p=>p.por==='fora',c:' deny ip any any'}],
pk:[{n:'Neville (dentro)',p:{diz:'aluno',por:'dentro'},e:'P',w:'Aluno de dentro passa.'},{n:'«Ron» (veio de fora)',p:{diz:'aluno',por:'fora'},e:'D',w:'Diz ser aluno mas veio de fora: Polissuco.'},{n:'visitante de Hogsmeade',p:{diz:'visitante',por:'fora'},e:'P',w:'Visitante comum pode passar.'},{n:'Hermione (dentro)',p:{diz:'aluno',por:'dentro'},e:'P',w:'Aluna de dentro passa.'}],
hint:'Barrar todo mundo de fora também barra os visitantes legítimos. Escolha só a regra que pega o impostor.',
head:'ip access-list extended ANTI-SPOOF',tail:'interface s0/0/0\n ip access-group ANTI-SPOOF in',lesson:'Isso é o anti-spoofing: pacotes vindos da internet não podem ter origem de endereço interno. Bloqueie o impossível e libere o resto.'},
{t:'Fase 4: as Casas',goal:'Mesma Casa: livre. Grifinória pode visitar a Corvinal só para estudar. O resto entre Casas, bloqueado.',
rules:[{id:'a',x:'Permitir: visitas dentro da mesma Casa',a:'P',f:p=>p.casa===p.visita,c:' ! mesma zona: livre, sem política'},
{id:'b',x:'Permitir: Grifinória → Corvinal, só para estudar',a:'P',f:p=>p.casa==='Grifinória'&&p.visita==='Corvinal'&&p.ativ==='estudar',c:' zone-pair security ZP-GRIF-CORV source GRIF destination CORV\n  service-policy type inspect PM-ESTUDO'},
{id:'c',x:'Barrar: quem não tem Casa',a:'D',f:p=>p.casa==='sem Casa',c:' ! interface sem zona: bloqueada com quem tem zona'},
{id:'d',x:'Permitir: qualquer visita',a:'P',f:p=>true,c:' ! (isso anularia o bloqueio padrão entre zonas)'}],
pk:[{n:'Hermione → Grifinória (conversar)',p:{casa:'Grifinória',visita:'Grifinória',ativ:'conversar'},e:'P',w:'Mesma Casa: livre.'},{n:'Hermione → Corvinal (estudar)',p:{casa:'Grifinória',visita:'Corvinal',ativ:'estudar'},e:'P',w:'Existe regulamento Grifinória → Corvinal para estudar.'},{n:'Ron → Sonserina (duelar)',p:{casa:'Grifinória',visita:'Sonserina',ativ:'duelar'},e:'D',w:'Não há regulamento para a Sonserina.'},{n:'Primeiranista sem Casa',p:{casa:'sem Casa',visita:'Grifinória',ativ:'conversar'},e:'D',w:'Sem Casa, sem conversa.'}],
hint:'Entre zonas o padrão já é bloquear. Você precisa liberar só o que o regulamento permite, e nada mais.',
head:'ZPF: o que a sua lista significa',tail:'',lesson:'No ZPF você só escreve o que é PERMITIDO. Entre zonas, o resto já é bloqueado por padrão, e «permitir qualquer visita» destruiria isso.'}
];
let li=0,list=[],tries=0,stars=0,busy=false,view=null;
const m=document.getElementById('m'),$=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const btn=(x,c,fn,d)=>{const b=el('button',c,x);b.onclick=fn;if(d)b.disabled=true;return b};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rule=(lv,id)=>lv.rules.find(r=>r.id===id);
function render(){m.replaceChildren();const lv=L[li];$('#stats').textContent=view==='start'?'':(li<L.length?'Fase '+(li+1)+' de '+L.length:'')+' · Estrelas: '+stars;
if(view==='start'){m.append(el('h2','','Você escreve a lista'),el('p','mut','Dessa vez, você não só decide: você monta a lista de regras do Filch. Escolha as regras, coloque na ordem certa e abra o portão para ver as corujas passarem ou serem barradas.'),btn('Começar','main',()=>{view='play';render()}));return}
if(view==='end'){m.append(el('h2','','Fim de jogo'),el('p','big','★ '+stars+' de '+L.length*3),el('p','mut','Você escreveu quatro listas de regras de verdade. É isso que se faz em ACLs e no ZPF: escolher as regras, cuidar da ordem e testar.'),btn('Jogar de novo','main',()=>{li=0;list=[];tries=0;stars=0;view='start';render()}));return}
m.append(el('h2','',lv.t),el('p','mut','Objetivo: '+lv.goal));
const sc=el('div','scene');sc.id='sc';sc.append(el('span','w','Quem chega'),el('div','g','🚪'),el('span','c','Castelo 🏰'));sc.firstChild.nextSibling.append(el('small','','Filch'));m.append(sc);
const cols=el('div','cols');
const A=el('div','box');A.append(el('h3','','Regras disponíveis'));
lv.rules.filter(r=>!list.includes(r.id)).forEach(r=>{const d=el('div','rule');d.append(el('span','tag '+(r.a==='P'?'p':'d'),r.a==='P'?'PERMITE':'BARRA'),el('span','t',r.x),btn('Usar','s',()=>{list.push(r.id);view='play';res=null;render()},busy));A.append(d)});
if(!A.querySelector('.rule'))A.append(el('p','mut','Todas as regras estão na lista.'));
const B=el('div','box');B.append(el('h3','','Sua lista (lida de cima para baixo)'));
list.forEach((id,i)=>{const r=rule(lv,id),d=el('div','rule');d.append(el('b','n',(i+1)+'.'),el('span','t',r.x),btn('↑','s',()=>mv(i,-1),busy||i===0),btn('↓','s',()=>mv(i,1),busy||i===list.length-1),btn('✕','s',()=>{list.splice(i,1);res=null;render()},busy));d.firstChild.setAttribute('aria-hidden','true');B.append(d)});
if(!list.length)B.append(el('p','mut','Vazia. Se você abrir o portão assim, ninguém passa.'));
B.append(el('div','rule',''));B.lastChild.className='rule';B.lastChild.style.opacity='.6';B.lastChild.append(el('b','n','·'),el('span','t','Barrar todo o resto (regra invisível do final)'));
cols.append(A,B);m.append(cols);
const r1=el('div','row');r1.append(btn('Abrir o portão e testar','main',run,busy||!list.length),btn('Limpar a lista','',()=>{list=[];res=null;render()},busy||!list.length));m.append(r1);
if(res){const b=el('div','box');b.append(el('h3','','Resultado do teste'));res.forEach(o=>{const d=el('div','res '+(o.ok?'ok':'no'));d.append(el('span','i',o.ok?'✓':'✗'));const s=el('span','',o.p.n+': '+(o.a==='P'?'passou':'foi barrado')+(o.i>=0?' (regra '+(o.i+1)+')':' (regra invisível)')+(o.ok?'':'. Deveria '+(o.p.e==='P'?'passar':'ser barrado')+': '+o.p.w));d.append(s);b.append(d)});m.append(b)}
if(res&&res.every(o=>o.ok)){const w=el('div','win');const st=tries===1?3:tries===2?2:1;w.append(el('strong','','Lista aprovada! '+'★'.repeat(st)+' ('+tries+(tries===1?' tentativa':' tentativas')+')'),el('p','',lv.lesson));
const cfg=(lv.head?lv.head+'\n':'')+list.map(id=>rule(lv,id).c).join('\n')+(lv.tail?'\n'+lv.tail:'');w.append(el('p','','Na prática, a sua lista vira isto no roteador:'),el('pre','',cfg));
w.append(btn(li===L.length-1?'Ver resultado':'Próxima fase','main',()=>{stars+=st;li++;list=[];tries=0;res=null;view=li>=L.length?'end':'play';render()}));m.append(w)}
else if(res&&tries>=2){m.append(Object.assign(el('div','hint'),{textContent:'Dica: '+lv.hint}))}}
let res=null;
function mv(i,d){[list[i],list[i+d]]=[list[i+d],list[i]];res=null;render()}
async function run(){if(busy)return;busy=true;res=null;render();const lv=L[li],rs=list.map(id=>rule(lv,id));
const out=lv.pk.map(p=>{const i=rs.findIndex(r=>r.f(p.p));const a=i>=0?rs[i].a:'D';return{p,i,a,ok:a===p.e}});
const sc=$('#sc');
for(const o of out){const c=el('div','chip '+(o.a==='P'?'p':'d'),'🦉 '+o.p.n);sc.append(c);
if(reduce){await sleep(150)}else{await sleep(30);c.style.left='38%';await sleep(800);if(o.a==='P'){c.style.left='62%';await sleep(800)}else{c.textContent='✋ '+o.p.n;await sleep(700)}}
c.remove()}
tries++;res=out;busy=false;render();const w=document.querySelector('.res');if(w)w.scrollIntoView({block:'nearest'})}
view='start';render();
</script>
</body>
</html>
